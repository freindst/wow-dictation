# Local Dictation helper (Steam Deck / Linux)
# Copied to ~/.config/local-dictation/config.ini by install.sh.
# Restart after editing:  systemctl --user restart local-dictation

[triggers]
# Keys the helper watches for. Bind a Steam Input chord to each (see deck/README.md).
# WoW also receives these keys, so keep them unbound in WoW.
record = ctrl+shift+f11
send = ctrl+shift+f12

[speech]
# whisper.cpp server. To use a faster PC on your network instead, run whisper-server there
# with --host 0.0.0.0 and set server_url to http://<pc-address>:8178 (and leave server_command empty).
server_url = http://127.0.0.1:8178
server_command = ~/.local/share/local-dictation/whisper.cpp/build/bin/whisper-server -m ~/.local/share/local-dictation/models/ggml-base.en.bin --host 127.0.0.1 --port 8178 -t 4
# {file} is replaced with a temporary WAV path. pw-record is part of PipeWire on SteamOS.
record_command = pw-record --rate 16000 --channels 1 --format s16 {file}

[delivery]
# Seconds between opening the addon preview and typing the transcript.
paste_delay = 0.6
# Delay after each virtual key event. Raise it if WoW drops letters.
key_delay_ms = 6
max_chars = 300

[addon]
# Signal keys the LocalDictation addon listens for. Must match the addon (Ctrl-Shift-F6..F10).
recording = ctrl+shift+f6
processing = ctrl+shift+f7
prepare = ctrl+shift+f8
send = ctrl+shift+f9
failed = ctrl+shift+f10
